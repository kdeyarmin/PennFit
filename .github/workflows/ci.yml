name: CI

# Retrigger registration for PR #1330 after missed pull_request events.
# Nudge 2026-08-26: Actions stopped firing synchronize after aafe1601e;
# a workflow-file touch re-registers the pull_request webhook.
# workflow_dispatch lets us kick a stuck branch when pull_request
# synchronize events are dropped by GitHub.
# Nudge 2: HEAD b02b17b9a still missing a full CI run (stuck queued
# legacy SHAs + startup_failure on 25c821923).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight CI run for a given branch when a new commit lands.
# Saves runner minutes on rapid push sequences and avoids a stale "passing"
# check from a previous head sticking around.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The pnpm version pinned in root package.json. Mirror it explicitly so
  # the workflow runner uses the same interpreter the lockfile was
  # produced with.
  PNPM_VERSION: "11.7.0"
  NODE_VERSION: "24"

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    # Every job carries a timeout. GitHub's default is SIX HOURS, so a step
    # that hangs (rather than fails) leaves a required check pending for the
    # rest of the day instead of going red in minutes. Values are ~5x the
    # observed run time, so a genuinely slow run is never killed; they exist
    # to catch a hang, not to police duration.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - run: pnpm lint:resupply

      # Prettier is the formatter of record (.prettierignore scopes it),
      # but nothing gated it — style drift slipped into PRs and polluted
      # diffs. `format:check` is non-destructive (it only reports), so a
      # failure here means "run `pnpm format` and recommit."
      - run: pnpm format:check

      - run: pnpm typecheck

  drift:
    name: Schema + codegen + architecture drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Codegen scripts read DATABASE_URL at import time. A syntactic
      # URL is enough — the drift checks run statically and don't open
      # a real connection.
      DATABASE_URL: postgresql://drift:drift@localhost:5432/drift_check
    steps:
      - uses: actions/checkout@v5

      # Migration prefix-collision guard. The same check runs as a local
      # pre-commit hook, but commits made via the GitHub web UI — or by
      # agents/CI without the hook installed — can still introduce a
      # duplicate NNNN_ migration prefix: two parallel PRs each grab the
      # next free number and only collide once both merge (that is how
      # 0156×4 / 0157×2 landed). Enforcing it here against the PR base
      # closes that gap. PR-only — a push to main has no base to diff.
      - name: Migration prefix collision check
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          BASE_REF=FETCH_HEAD DIFF_TARGET= bash scripts/check-resupply-migration-prefix.sh

      # Tree-wide duplicate-prefix guard (app-review 2026-06-10, P2-15).
      # The diff-based check above can't see two PRs racing main with
      # the same fresh prefix — neither PR's diff collides against its
      # own base, and the duplicate only exists after BOTH merge (that
      # is how 0208/0248/0250/0253/0254/0257 landed as duplicates).
      # This one scans the whole tree against a frozen allowlist of the
      # historical duplicates, so it runs on pushes to main too — the
      # post-merge run is the one that catches the race.
      - name: Migration prefix tree-wide duplicate check
        run: bash scripts/check-resupply-migration-prefix-tree.sh

      # Migration immutability guard. Complements the prefix check above:
      # a migration that already exists on the PR base must not be edited
      # or deleted. migrate.mjs dedups applied migrations by content hash,
      # so an in-place edit makes the deploy-time migrator re-apply the
      # file against prod and gates the Railway release if it isn't
      # perfectly idempotent — the 2026-06-05 0212_compliance_rules.sql
      # incident. PR-only — a push to main has no base to diff.
      - name: Migration immutability check
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          BASE_REF=FETCH_HEAD DIFF_TARGET= bash scripts/check-resupply-migration-immutability.sh

      # Block NEW "readFileSync my own source and grep it" tests (they
      # pass on broken logic + break on refactors). Only fires on files
      # ADDED in the PR, so the ~98 legacy offenders don't block anyone;
      # an inline `allow-source-read` comment opts a file out. PR-only —
      # a push to main has no base to diff.
      - name: Source-grep test guard
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          BASE_REF=FETCH_HEAD DIFF_TARGET= bash scripts/check-no-source-grep-tests.sh

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # The architecture checker is a set of ripgrep queries; the
      # ubuntu-latest runner image does not ship `rg`. Without it the
      # checker matched nothing and "passed" vacuously — the gate enforced
      # nothing in CI until this step was added (surfaced by wiring the
      # checker's own self-test into CI; the checker now also hard-fails
      # if rg is absent rather than passing empty).
      - name: Install ripgrep
        # Pinned static binary from ripgrep's own GitHub releases — NOT
        # apt. The apt path depended on Ubuntu's mirror fleet and stalled
        # until its timeout whenever a mirror degraded (2026-08-19: two
        # identical 5-minute `apt-get update` hangs in a row while every
        # sibling job on the same runs passed; runners had hung here
        # before that too). A GitHub-to-GitHub download shares fate with
        # the CI platform itself, and the pinned sha256 (copied from the
        # release's official .sha256 asset) makes the artifact
        # tamper-evident. Bump RG_VERSION + RG_SHA256 together.
        timeout-minutes: 2
        env:
          RG_VERSION: 14.1.1
          RG_SHA256: 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
        run: |
          curl -fsSL --retry 3 -o /tmp/rg.tar.gz \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${RG_SHA256}  /tmp/rg.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rg.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rg --version

      - name: Architecture drift
        run: scripts/check-resupply-architecture.sh

      # Admin route gate audit — every admin mutation must carry
      # requirePermission / requireAdmin / requireAdminOnly. The
      # script's --self-test exercises the detector logic against a
      # fixture tree of known-good and known-bad routes; the bare
      # invocation scans the real artifacts/resupply-api admin tree
      # and exits non-zero only when a mutation is truly ungated.
      - name: Admin route gate audit
        run: |
          scripts/check-admin-route-gates.sh --self-test
          scripts/check-admin-route-gates.sh

      # Multi-tenant isolation gate (Phase 0 workstream E1). The
      # --self-test plants a direct callsite in a fixture tree and asserts
      # the checker catches it; the bare invocation enforces that NO file
      # calls getSupabaseServiceRoleClient() directly in application code
      # (the cutover is complete — only the reviewed global/auth callers
      # in the script's EXCLUDES are exempt).
      - name: Tenant isolation guard
        run: |
          scripts/check-tenant-isolation.sh --self-test
          scripts/check-tenant-isolation.sh

      # Raw-escape-hatch org-scope gate. The tenant-isolation guard above only
      # inspects getOrgScopedClient() callsites; this one inspects the `.raw()`
      # escape hatch, failing on any read/write of a guarded tenant-scoped
      # object (public.orders, the fitter metrics views) that omits its org_id
      # filter — the class of cross-tenant leak that shipped twice. --self-test
      # plants an unscoped read in a fixture tree and asserts the catch.
      - name: Raw org-scope guard
        run: |
          scripts/check-raw-org-scope.sh --self-test
          scripts/check-raw-org-scope.sh

      # Fixture-driven negative-test harnesses for the guard scripts:
      # each `--self-test` execs the sibling `*.sh.test`, which builds a
      # synthetic tree, plants known violations, and asserts the checker
      # catches them (then that a clean tree passes). The admin-gate
      # harness already runs via its `--self-test` in the step above; the
      # architecture + migration-prefix harnesses shipped with their
      # checkers but ran in NO pipeline until now — see
      # docs/workflow-efficiency-audit-2026-06-04.md (W5/W5a). They guard
      # the repo's primary architecture invariant, so an undetected
      # regression in the checker itself is exactly what they prevent.
      - name: Architecture checker self-test
        run: scripts/check-resupply-architecture.sh --self-test

      - name: Migration-prefix checker self-test
        run: scripts/check-resupply-migration-prefix.sh --self-test

      - name: Migration-immutability checker self-test
        run: scripts/check-resupply-migration-immutability.sh --self-test

      - name: Source-grep test guard self-test
        run: bash scripts/check-no-source-grep-tests.sh --self-test

      # Self-test for the pre-commit staged-snapshot library (the helper
      # that makes the hook's checks see the staged index, not the live
      # working tree). No `--self-test` wrapper — it's a hook lib, not a
      # checker — so invoke the harness directly. Was dormant; its
      # scenario 9 also had a self-inflicted bug (an in-repo stderr sink
      # the lib correctly swept), fixed in the same change that wired it
      # in. See docs/workflow-efficiency-audit-2026-06-04.md (W5).
      - name: Skipped-test guard self-test
        run: node scripts/ci/assert-no-skipped-tests.mjs --self-test

      - name: Staged-snapshot library self-test
        run: bash scripts/git-hooks/lib-staged-snapshot.test

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The vitest suites mock the DB layer with fluent stubs, so the bulk
    # of the tests need no real Postgres and run here. The DB-backed
    # suites self-skip when their env is absent:
    #   * lib/resupply-db/scripts/migrate.test.ts  -> describe.skipIf(!DATABASE_URL)
    #   * lib/resupply-db/scripts/migration-pr-changes.test.ts -> same
    #   * .../invite-password-expiry-notify.integration.test.ts
    #       -> skips unless DATABASE_URL + SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY
    # DATABASE_URL is intentionally NOT set here, so those skip cleanly.
    #
    # The migration-replay suites now run for real in the dedicated
    # `migrations` job below (Postgres service container). The earlier
    # claim that the from-scratch replay was "broken (~17 ordering/role
    # failures)" turned out to be stale: the only gap was that the
    # GRANT/REVOKE migrations (0169+) target the Supabase-provided roles
    # anon/authenticated/service_role, which exist on managed Supabase
    # but not on a vanilla Postgres — create those three roles first and
    # the full 0000..latest chain applies cleanly. The PostgREST-backed
    # invite-password-expiry-notify suite still needs a full Supabase
    # stack (PostgREST + GoTrue), not just a Postgres container, so it
    # remains skipped pending a local-Supabase harness.

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run tests
        run: pnpm -r --if-present run test
      - name: Diagnostics — failure tail
        if: failure()
        run: |
          set -x
          date
          free -m
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' 2>&1 | head -10 || true
          # Look for crashed worker logs vitest leaves behind.
          find . -maxdepth 4 -name '*.log' -newer /tmp/runtime-marker 2>/dev/null | head -20 || true

  migrations:
    name: Migration replay (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Runs the DB-backed migration suites against a real Postgres:
    #   * migrate.test.ts            — full 0000..latest from-scratch
    #                                  replay + idempotence on re-run
    #   * migration-pr-changes.test.ts — post-migration schema assertions
    # Both gate on DATABASE_URL (skipIf), so they run here and skip in the
    # unit-only `test` job above. This is the harness that was previously
    # removed; it works once the Supabase platform roles exist (see the
    # "Create Supabase platform roles" step).

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resupply_ci
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the steps run.
        options: >-
          --health-cmd "pg_isready -U postgres -d resupply_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resupply_ci

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Supabase provisions anon/authenticated/service_role as managed
      # platform roles; the resupply migrations GRANT/REVOKE against them
      # (0169+). A vanilla Postgres service container has none, so create
      # the three before any replay. (migrate.test.ts also creates them
      # idempotently in beforeAll, but the explicit migrate step below
      # runs outside vitest and needs them first.)
      - name: Create Supabase platform roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN;" \
            -c "CREATE ROLE authenticated NOLOGIN;" \
            -c "CREATE ROLE service_role NOLOGIN;"

      # Apply the full migration chain once so migration-pr-changes.test.ts
      # — which assumes an already-migrated DATABASE_URL and does not run
      # the migrator itself — has a schema to inspect. migrate.test.ts
      # re-runs the migrator (idempotent) and spins up its own temp DBs
      # for the from-scratch path.
      - name: Apply migrations (from scratch)
        run: node lib/resupply-db/scripts/migrate.mjs

      - name: Run DB-backed migration tests
        run: pnpm --filter @workspace/resupply-db test

  integration:
    name: Integration (PostgREST)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Runs the DB-backed Supabase integration test(s) — the worker
    # `*.integration.test.ts` suite (invite-password-expiry-notify and the
    # multi-tenant cron fan-out tests, e.g. maintenance-nudges) — against a
    # REAL PostgREST surface (the service-role data path), not just a
    # Postgres container. We don't spin up the full managed Supabase stack (Kong +
    # GoTrue + Storage): a standalone PostgREST binary plus a tiny
    # /rest/v1 path proxy is enough for what these tests exercise. The
    # bootstrap lives in scripts/ci/start-test-postgrest.sh.
    #
    # Deliberately advisory, and NOT for the reason the a11y job used to be:
    # this soft gate is not a "prove itself" window that expires, it covers a
    # standing environmental risk. The job downloads a PostgREST binary from
    # a third-party release host and starts it as a daemon, so a bad mirror
    # or a slow runner can redden it on a commit that touches nothing it
    # tests. The assertions themselves are validated and expected to pass —
    # treat a failure here as a real signal worth reading, just not one that
    # blocks a merge on someone else's infrastructure.
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resupply_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resupply_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resupply_ci

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Migrations 0169+ GRANT/REVOKE against the Supabase platform roles;
      # create them before the replay (see the migrations job).
      - name: Create Supabase platform roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN;" \
            -c "CREATE ROLE authenticated NOLOGIN;" \
            -c "CREATE ROLE service_role NOLOGIN;"

      - name: Apply migrations
        run: node lib/resupply-db/scripts/migrate.mjs

      # Grants service_role, downloads PostgREST, starts it + the
      # /rest/v1 proxy (background — they persist across steps), and
      # exports SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY to $GITHUB_ENV.
      - name: Start standalone PostgREST
        run: bash scripts/ci/start-test-postgrest.sh

      - name: Run PostgREST integration tests
        run: |
          pnpm --filter @workspace/resupply-api exec \
            vitest run \
              src/worker/jobs/invite-password-expiry-notify.integration.test.ts \
              src/worker/jobs/maintenance-nudges.integration.test.ts \
              src/worker/jobs/video-visit-reminders.integration.test.ts \
              src/worker/jobs/recall-notifications-send.integration.test.ts \
              src/worker/jobs/patient-packet-reminders.integration.test.ts \
              src/worker/jobs/pacware-ready-to-sync-digest.integration.test.ts \
              src/worker/jobs/reminders.integration.test.ts

  a11y:
    name: A11y (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Independent from the rest of CI: builds the SPA, serves it via
    # vite preview, and runs e2e/tests/a11y.spec.ts against the major
    # public routes. Fails on `serious` or `critical` axe violations
    # (the lower tiers tend to be cosmetic-but-debatable; tightening
    # the bar after the noisier findings are addressed is a one-line
    # change in e2e/tests/a11y.spec.ts).
    #
    # REQUIRED (not continue-on-error). The soft gate existed to give the
    # team a window to triage baseline violations before flipping this to
    # required; that window is closed — the sweep is green on every public
    # route it covers. Leaving it advisory now buys nothing and costs the
    # signal: an a11y regression on a patient-facing health app would merge
    # with a green check. Patients using this storefront are
    # disproportionately older and low-vision (the same reason index.html
    # deliberately allows pinch-zoom), so this is a product requirement,
    # not a lint.
    #
    # The fitter funnel's own axe sweep (fitter-funnel-a11y.spec.ts) needs
    # the unbundled dev server, so it runs in the e2e-dev job instead.

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Build the SPA. vite preview serves the built artifact on the
      # port we pass in via E2E_PORT; the e2e config defaults to
      # 5173 if E2E_PORT is unset.
      - name: Build cpap-fitter SPA
        run: pnpm --filter @workspace/cpap-fitter run build

      # Cache the downloaded browser binary across runs (and between the
      # a11y + smoke jobs in the same run, since they share this cache
      # key). On a hit, `playwright install` below skips the ~100 MB
      # chromium download and only the (fast) OS-dependency apt step runs.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # Split from the system-deps step below on purpose. This half is the
      # browser binary itself: fetched from Playwright's CDN, fast, and
      # REQUIRED — without it there is nothing to run tests in.
      - name: Install Playwright browser (chromium only)
        timeout-minutes: 8
        run: pnpm exec playwright install chromium

      # This half shells out to apt, and it is the part that stalls.
      # Bounding it (the previous `--with-deps` + timeout-minutes: 8) turned
      # an indefinite hang into a fast failure, but still a failure: on
      # 2026-08-18 an Ubuntu mirror serving at ~45 kB/s failed four
      # Playwright jobs at this step, on commits where no test had executed
      # and one of which touched only a markdown file.
      #
      # ubuntu-latest already ships every library Playwright needs — those
      # logs showed each one "already the newest version", with only fonts
      # (for non-Latin rendering) still being fetched. So this is a top-up,
      # not a prerequisite, and a slow mirror should not be able to redden a
      # check. If a library genuinely IS missing, chromium fails to launch
      # and the test step reports that, which is a clearer signal than an
      # apt transcript.
      - name: Install Playwright system dependencies (best effort)
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm exec playwright install-deps chromium

      # Serve the built SPA in the background. `vite preview` exits
      # the process when the parent shell exits, so we don't need an
      # explicit shutdown step.
      #
      # vite.config.ts requires PORT + BASE_PATH at config-resolution
      # time (the !isBuild guard fires for `vite preview` since
      # process.argv contains "preview", not "build"). Set both here
      # so the config loads cleanly. PORT must match the --port flag
      # we pass (the config feeds it into preview.port; mismatch
      # causes strictPort failures).
      - name: Start vite preview
        env:
          PORT: "5173"
          BASE_PATH: "/"
        run: |
          pnpm --filter @workspace/cpap-fitter exec \
            vite preview --config vite.config.ts --host 127.0.0.1 --port 5173 &
          # Wait for the port to be ready (vite preview is fast but
          # not instant); fail fast at 30s if it never opens.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null 2>&1; then
              echo "vite preview is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "vite preview did not respond on :5173 within 30s"
          exit 1

      - name: Run a11y tests
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          CI: "true"
        run: pnpm exec playwright test --config e2e/playwright.config.ts e2e/tests/a11y.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-report
          # Both: the html report (readable summary) and test-results/
          # (traces from `trace: on-first-retry`, plus failure screenshots).
          # The trace is what makes a CI-only failure diagnosable.
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  smoke:
    name: Smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Required check (NOT continue-on-error): a smoke-test failure
    # means the SPA build is broken — anyone visiting the site would
    # see a blank page or a runtime error. The single existing test
    # (e2e/tests/storefront-loads.spec.ts) just confirms the React
    # app mounts and the landing nav renders without console errors.
    # Add more specs here as the team picks up the suite.
    #
    # Job structure mirrors the a11y job above; the duplication is
    # intentional so each signal reports independently. If future
    # work bundles them, factor the shared setup into a composite
    # action.
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build cpap-fitter SPA
        run: pnpm --filter @workspace/cpap-fitter run build

      # Shares the cache key with the a11y job (see its comment); chromium
      # is downloaded at most once per CI run and reused across runs while
      # pnpm-lock.yaml (hence the Playwright version) is unchanged.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # Split from the system-deps step below on purpose. This half is the
      # browser binary itself: fetched from Playwright's CDN, fast, and
      # REQUIRED — without it there is nothing to run tests in.
      - name: Install Playwright browser (chromium only)
        timeout-minutes: 8
        run: pnpm exec playwright install chromium

      # This half shells out to apt, and it is the part that stalls.
      # Bounding it (the previous `--with-deps` + timeout-minutes: 8) turned
      # an indefinite hang into a fast failure, but still a failure: on
      # 2026-08-18 an Ubuntu mirror serving at ~45 kB/s failed four
      # Playwright jobs at this step, on commits where no test had executed
      # and one of which touched only a markdown file.
      #
      # ubuntu-latest already ships every library Playwright needs — those
      # logs showed each one "already the newest version", with only fonts
      # (for non-Latin rendering) still being fetched. So this is a top-up,
      # not a prerequisite, and a slow mirror should not be able to redden a
      # check. If a library genuinely IS missing, chromium fails to launch
      # and the test step reports that, which is a clearer signal than an
      # apt transcript.
      - name: Install Playwright system dependencies (best effort)
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm exec playwright install-deps chromium

      # vite.config.ts requires PORT + BASE_PATH at config-resolution
      # time (the !isBuild guard fires for `vite preview` because
      # process.argv contains "preview", not "build"). Setting them
      # here mirrors the a11y job above.
      - name: Start vite preview
        env:
          PORT: "5173"
          BASE_PATH: "/"
        run: |
          pnpm --filter @workspace/cpap-fitter exec \
            vite preview --config vite.config.ts --host 127.0.0.1 --port 5173 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null 2>&1; then
              echo "vite preview is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "vite preview did not respond on :5173 within 30s"
          exit 1

      - name: Run smoke test
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          CI: "true"
        run: pnpm exec playwright test --config e2e/playwright.config.ts e2e/tests/storefront-loads.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          # Both: the html report (readable summary) and test-results/
          # (traces from `trace: on-first-retry`, plus failure screenshots).
          # The trace is what makes a CI-only failure diagnosable.
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-dev:
    name: E2E (Playwright, dev server)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The dev-server half of the storefront suite, and the only job that
    # runs the WHOLE default Playwright project.
    #
    # Several specs stub @mediapipe/tasks-vision by intercepting the
    # ES-module request, which only exists as a separate fetch when modules
    # are served unbundled (dev). Under `vite preview` (what the smoke/a11y
    # jobs use) the module is bundled, so those specs self-skip — a silent
    # pass. results-page-resilience.spec.ts hit exactly that and ran in NO
    # CI job until it was wired in here (docs/workflow-efficiency-audit-
    # 2026-06-04.md, W4).
    #
    # This job runs `playwright test` with NO file filter so that class of
    # gap cannot come back: the dev server satisfies every spec's harness
    # requirement, so a new spec is covered the moment it lands instead of
    # waiting for someone to remember to add a `run:` line. Naming one file
    # here is what let fitter-funnel-full.spec.ts (the entire virtual mask
    # fitter funnel — consent → capture → measure → questionnaire →
    # results → order, plus every camera/vision/storage failure path),
    # fitter-funnel-a11y.spec.ts, and home-trust-signals.spec.ts sit
    # unrun in any job.
    #
    # The default project excludes the admin specs + auth setup (they need
    # the backend-backed stack — see the e2e-admin job), so this is the
    # storefront suite: ~24 tests, ~1 min. CI retries twice
    # (e2e/playwright.config.ts), which absorbs the timing jitter of the
    # mocked-camera walks.

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # The dev server's predev hook downloads the MediaPipe model from
      # storage.googleapis.com; run it as an explicit, debuggable step so
      # a download failure is distinct from a server-start failure.
      - name: Pre-download MediaPipe assets
        run: node artifacts/cpap-fitter/scripts/setup-mediapipe.mjs

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # Split from the system-deps step below on purpose. This half is the
      # browser binary itself: fetched from Playwright's CDN, fast, and
      # REQUIRED — without it there is nothing to run tests in.
      - name: Install Playwright browser (chromium only)
        timeout-minutes: 8
        run: pnpm exec playwright install chromium

      # This half shells out to apt, and it is the part that stalls.
      # Bounding it (the previous `--with-deps` + timeout-minutes: 8) turned
      # an indefinite hang into a fast failure, but still a failure: on
      # 2026-08-18 an Ubuntu mirror serving at ~45 kB/s failed four
      # Playwright jobs at this step, on commits where no test had executed
      # and one of which touched only a markdown file.
      #
      # ubuntu-latest already ships every library Playwright needs — those
      # logs showed each one "already the newest version", with only fonts
      # (for non-Latin rendering) still being fetched. So this is a top-up,
      # not a prerequisite, and a slow mirror should not be able to redden a
      # check. If a library genuinely IS missing, chromium fails to launch
      # and the test step reports that, which is a clearer signal than an
      # apt transcript.
      - name: Install Playwright system dependencies (best effort)
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm exec playwright install-deps chromium

      # `vite dev` (not preview) so modules are served unbundled and the
      # spec's @mediapipe/tasks-vision module stub can take effect. The
      # dev script already passes --host 0.0.0.0; vite reads PORT +
      # BASE_PATH from env (strictPort: true).
      - name: Start vite dev server
        env:
          PORT: "5173"
          BASE_PATH: "/"
        run: |
          pnpm --filter @workspace/cpap-fitter dev &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null 2>&1; then
              echo "vite dev is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "vite dev did not respond on :5173 within 60s"
          exit 1

      # No file filter on purpose — see the job comment. Every storefront
      # spec runs here, including the ones that only work unbundled.
      - name: Run storefront E2E suite (dev server)
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          CI: "true"
        run: pnpm exec playwright test --config e2e/playwright.config.ts

      # Playwright exits 0 when a test calls test.skip(), so "green" does not
      # mean "ran". Several specs skip themselves when the
      # @mediapipe/tasks-vision module stub fails to intercept — which is
      # correct under `vite preview` but never expected here, against the dev
      # server. Without this the job would keep passing while quietly covering
      # less, which is the exact gap this job was added to close.
      #
      # --min guards the other direction: a filter or config change that
      # narrows the suite toward zero.
      - name: Assert nothing was skipped
        if: always()
        run: >
          node scripts/ci/assert-no-skipped-tests.mjs
          playwright-report/results.json --min 20

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-dev-report
          # Both: the html report (readable summary) and test-results/
          # (traces from `trace: on-first-retry`, plus failure screenshots).
          # The trace is what makes a CI-only failure diagnosable.
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  railway-build:
    name: Railway prod build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Builds the production deploy artifacts the way Railway does — which
    # NOTHING else in CI exercises: the other jobs only typecheck/test or
    # build the SPA, never the resupply-api esbuild bundle. Runs the exact
    # railway.json buildCommand on Node 24 with NODE_ENV=production, so a
    # broken production build can't stay green in CI again. See
    # docs/railway-hosting-review-2026-05-29.md R6.
    #
    # NODE_ENV=production is set to mirror Railway. (Note: pnpm — unlike npm
    # — does NOT drop devDependencies for NODE_ENV, so the build toolchain is
    # present; that is verified by the install + build below.)
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install: "false"
          # The explicit "Install (frozen)" step below populates the pnpm
          # store, so the store cache is safe here (unlike the audit job,
          # which never installs and must leave the cache off — see the
          # `cache` input in .github/actions/setup/action.yml).
          cache: "true"

      - name: Toolchain + env
        run: node -v && pnpm -v && echo "NODE_ENV=$NODE_ENV"

      # Mirror Railpack's install (plain frozen install — includes dev deps).
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      # The exact railway.json buildCommand: build the artifacts only,
      # serialized to keep peak memory low, and (deliberately) WITHOUT the
      # redundant typecheck — esbuild/vite bundle the libs from src, and CI's
      # lint-typecheck job already gates types. Keep this in sync with
      # railway.json's build.buildCommand.
      - name: Railway buildCommand
        run: pnpm -r --workspace-concurrency=1 --if-present run build && node scripts/embed-spa.mjs

      - name: Confirm the deploy artifacts were produced
        run: |
          test -f artifacts/resupply-api/dist/index.mjs && echo "resupply-api dist/index.mjs OK"
          test -f artifacts/cpap-fitter/dist/public/index.html && echo "cpap-fitter SPA OK"
          test -f artifacts/resupply-api/dist/public/index.html && echo "embedded SPA (resupply-api/dist/public) OK"

  e2e-admin:
    name: E2E (admin · backend-backed)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Backend-backed admin e2e: stands up the FULL runtime stack —
    # Postgres + standalone PostgREST (the service-role data path) + the
    # built Express API co-serving the built SPA — seeds an admin, then
    # runs the authenticated Playwright `admin` project against it. This
    # is the coverage the storefront-only smoke/a11y jobs can't reach
    # (anything behind requireAdmin / a real Supabase write).
    #
    # Reuses the same building blocks as the `integration` job (Postgres
    # service + platform roles + migrate.mjs + start-test-postgrest.sh).
    #
    # Advisory for the same standing reason as the `integration` job (see
    # its comment): this stack pulls the same third-party PostgREST binary,
    # so an external outage could block merges on a commit it doesn't test.
    # The storefront half of the suite IS gated — see e2e-dev.
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resupply_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resupply_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resupply_ci
      # API service-boot contract. The runtime data path is PostgREST;
      # SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY are exported into
      # $GITHUB_ENV by start-test-postgrest.sh (available to later steps).
      PORT: "3000"
      BASE_PATH: "/"
      RESUPPLY_LINK_HMAC_KEY: pennfit-ci-link-hmac-key-0123456789-0123456789
      RESUPPLY_ALLOWED_ORIGINS: http://127.0.0.1:3000
      SUPABASE_STORAGE_BUCKET_PRIVATE: private
      # Admin e2e: the password is shared between the seed step
      # (ADMIN_PASSWORD, read by auth:set-admin-password) and the
      # Playwright sign-in (E2E_ADMIN_PASSWORD). CI-only throwaway creds.
      E2E_ADMIN: "1"
      E2E_ADMIN_EMAIL: e2e-admin@example.com
      E2E_ADMIN_PASSWORD: e2e-Admin-Pass-123!
      ADMIN_PASSWORD: e2e-Admin-Pass-123!

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        run: |
          corepack disable pnpm 2>/dev/null || true
          npm install -g pnpm@${{ env.PNPM_VERSION }}
          pnpm --version

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Migrations 0169+ GRANT/REVOKE against the Supabase platform roles;
      # create them before the replay (see the migrations/integration jobs).
      - name: Create Supabase platform roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN;" \
            -c "CREATE ROLE authenticated NOLOGIN;" \
            -c "CREATE ROLE service_role NOLOGIN;"

      - name: Apply migrations
        run: node lib/resupply-db/scripts/migrate.mjs

      # Grants service_role, downloads + starts PostgREST and the /rest/v1
      # proxy (background, persist across steps), and exports SUPABASE_URL
      # + SUPABASE_SERVICE_ROLE_KEY to $GITHUB_ENV.
      - name: Start standalone PostgREST
        run: bash scripts/ci/start-test-postgrest.sh

      # Create an active admin with a known password (no email needed).
      # The sign-in path refuses any user whose email_verified_at is
      # NULL (see lib/resupply-auth/src/http/sign-in.ts), and the seed
      # script intentionally doesn't touch email verification, so mark
      # the seeded e2e admin verified directly — otherwise the
      # authenticated Playwright project can never get past
      # /admin/sign-in.
      - name: Seed e2e admin
        run: |
          pnpm --filter @workspace/scripts auth:set-admin-password \
            --email="$E2E_ADMIN_EMAIL" --role=admin
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "UPDATE resupply_auth.users
                   SET email_verified_at = COALESCE(email_verified_at, now())
                 WHERE email_lower = lower('$E2E_ADMIN_EMAIL');"

      # auth:set-admin-password sets status=active + the password but does
      # NOT mark the email verified, and the in-house sign-in refuses
      # unverified accounts (lib/resupply-auth/src/http/sign-in.ts →
      # email_unverified). Stamp email_verified_at directly so the
      # Playwright sign-in can complete. resupply_auth.users keys on
      # email_lower (app-normalized, lowercase).
      - name: Mark e2e admin email verified
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "UPDATE resupply_auth.users SET email_verified_at = now() WHERE email_lower = lower('$E2E_ADMIN_EMAIL');"

      # Mirror the Railway buildCommand so the API entrypoint
      # (dist/index.mjs) and the co-served SPA (dist/public) both exist.
      - name: Build deploy artifacts (API + embedded SPA)
        run: pnpm -r --workspace-concurrency=1 --if-present run build && node scripts/embed-spa.mjs

      - name: Start API (co-serves the SPA) and wait for ready
        run: |
          node --enable-source-maps artifacts/resupply-api/dist/index.mjs &
          # Liveness first (no dependencies).
          live=""
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/resupply-api/healthz > /dev/null 2>&1; then
              echo "API live after ${i}s"; live=1; break
            fi
            sleep 1
          done
          if [ -z "$live" ]; then
            echo "API did not become live on :3000 within 40s"; exit 1
          fi
          # Then readiness: /readyz exercises the PostgREST/DB path + the
          # pg-boss queue, so waiting on it warms the cold start that the
          # FIRST real sign-in would otherwise race (healthz is liveness
          # only and never touches the DB). Best-effort — if it never goes
          # ready we still run the suite; admin-auth.setup.ts asserts the
          # sign-in response and will report which dependency was unhappy.
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/resupply-api/readyz > /dev/null 2>&1; then
              echo "API ready (DB + queue) after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::warning::API /readyz not ready within 45s; proceeding (the admin sign-in test will surface any dependency failure)"

      # Split from the system-deps step below on purpose. This half is the
      # browser binary itself: fetched from Playwright's CDN, fast, and
      # REQUIRED — without it there is nothing to run tests in.
      - name: Install Playwright browser (chromium only)
        timeout-minutes: 8
        run: pnpm exec playwright install chromium

      # This half shells out to apt, and it is the part that stalls.
      # Bounding it (the previous `--with-deps` + timeout-minutes: 8) turned
      # an indefinite hang into a fast failure, but still a failure: on
      # 2026-08-18 an Ubuntu mirror serving at ~45 kB/s failed four
      # Playwright jobs at this step, on commits where no test had executed
      # and one of which touched only a markdown file.
      #
      # ubuntu-latest already ships every library Playwright needs — those
      # logs showed each one "already the newest version", with only fonts
      # (for non-Latin rendering) still being fetched. So this is a top-up,
      # not a prerequisite, and a slow mirror should not be able to redden a
      # check. If a library genuinely IS missing, chromium fails to launch
      # and the test step reports that, which is a clearer signal than an
      # apt transcript.
      - name: Install Playwright system dependencies (best effort)
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm exec playwright install-deps chromium

      - name: Run admin e2e (authenticated)
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          CI: "true"
        run: pnpm exec playwright test --config e2e/playwright.config.ts --project=admin

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-admin-report
          # Both: the html report (readable summary) and test-results/
          # (traces from `trace: on-first-retry`, plus failure screenshots).
          # The trace is what makes a CI-only failure diagnosable.
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  audit:
    name: Dependency audit (high)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Surfaces known high-severity transitive CVEs in the dependency
    # tree. This is a PHI-adjacent app, so a vulnerable transitive dep
    # is worth knowing about. Started soft-gated during the initial
    # advisory triage; promoted to BLOCKING 2026-06-09 with the tree
    # clean (`pnpm audit --audit-level=high` → no known vulnerabilities).
    # If a fresh unpatchable advisory ever blocks an unrelated PR, prefer
    # a scoped `pnpm.auditConfig.ignoreCves` entry in package.json (with
    # a comment linking the advisory) over flipping this back to soft.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install: "false"

      - name: pnpm audit (high+)
        run: pnpm audit --audit-level=high
