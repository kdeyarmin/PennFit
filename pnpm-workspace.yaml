packages:
  - artifacts/*
  - lib/*
  - scripts

allowBuilds:
  argon2: true
  esbuild: true

autoInstallPeers: false

catalog:
  "@tailwindcss/vite": ^4.3.0
  "@tanstack/react-query": ^5.100.10
  "@types/node": ^24.0.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^6.0.2
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  framer-motion: ^12.23.24
  lucide-react: ^1.16.0
  react: 19.2.6
  react-dom: 19.2.6
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.0
  tsx: ^4.22.0
  vite: ^8.0.16
  zod: 4.4.3

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - msw
  - unrs-resolver

overrides:
  "@esbuild-kit/esm-loader": npm:tsx@^4.21.0
  "@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-freebsd-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-freebsd-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-arm": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-arm64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-sunos-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-win32-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-win32-x64": "-"
  "@tailwindcss/oxide>@tailwindcss/oxide-android-arm64": "-"
  "@tailwindcss/oxide>@tailwindcss/oxide-darwin-arm64": "-"
  "@tailwindcss/oxide>@tailwindcss/oxide-darwin-x64": "-"
  "@tailwindcss/oxide>@tailwindcss/oxide-freebsd-x64": "-"
  "@tailwindcss/oxide>@tailwindcss/oxide-linux-arm-gnueabihf": "-"
  "@tailwindcss/oxide>@tailwindcss/oxide-linux-arm64-gnu": "-"
  "@tailwindcss/oxide>@tailwindcss/oxide-linux-arm64-musl": "-"
  "@tailwindcss/oxide>@tailwindcss/oxide-linux-x64-musl": "-"
  "@tailwindcss/oxide>@tailwindcss/oxide-win32-arm64-msvc": "-"
  # GHSA-v422-hmwv-36x6: body-parser < 2.3.0 silently disables request-size
  # enforcement when handed an invalid `limit`, turning a typo into an
  # unbounded-body DoS. Every callsite here passes a valid literal ("256kb",
  # "1mb", …) so the app is not exploitable today, but this API accepts PHI
  # uploads and the guard should not depend on nobody ever fat-fingering a
  # limit. express@5 already declares ^2.2.1, so this only forces the
  # resolution forward inside that range — pinned rather than `pnpm update`d
  # because the recursive update also dragged vite/rolldown forward, which
  # has no business in a security patch.
  body-parser: ^2.3.0
  esbuild: ^0.28.1
  esbuild>@esbuild/aix-ppc64: "-"
  esbuild>@esbuild/android-arm: "-"
  esbuild>@esbuild/android-arm64: "-"
  esbuild>@esbuild/android-x64: "-"
  esbuild>@esbuild/darwin-arm64: "-"
  esbuild>@esbuild/darwin-x64: "-"
  esbuild>@esbuild/freebsd-arm64: "-"
  esbuild>@esbuild/freebsd-x64: "-"
  esbuild>@esbuild/linux-arm: "-"
  esbuild>@esbuild/linux-arm64: "-"
  esbuild>@esbuild/linux-ia32: "-"
  esbuild>@esbuild/linux-loong64: "-"
  esbuild>@esbuild/linux-mips64el: "-"
  esbuild>@esbuild/linux-ppc64: "-"
  esbuild>@esbuild/linux-riscv64: "-"
  esbuild>@esbuild/linux-s390x: "-"
  esbuild>@esbuild/netbsd-arm64: "-"
  esbuild>@esbuild/netbsd-x64: "-"
  esbuild>@esbuild/openbsd-arm64: "-"
  esbuild>@esbuild/openbsd-x64: "-"
  esbuild>@esbuild/openharmony-arm64: "-"
  esbuild>@esbuild/sunos-x64: "-"
  esbuild>@esbuild/win32-arm64: "-"
  esbuild>@esbuild/win32-ia32: "-"
  lightningcss>lightningcss-android-arm64: "-"
  lightningcss>lightningcss-darwin-arm64: "-"
  lightningcss>lightningcss-darwin-x64: "-"
  lightningcss>lightningcss-freebsd-x64: "-"
  lightningcss>lightningcss-linux-arm-gnueabihf: "-"
  lightningcss>lightningcss-linux-arm64-gnu: "-"
  lightningcss>lightningcss-linux-arm64-musl: "-"
  lightningcss>lightningcss-linux-x64-musl: "-"
  lightningcss>lightningcss-win32-arm64-msvc: "-"
  rollup>@rollup/rollup-android-arm-eabi: "-"
  rollup>@rollup/rollup-android-arm64: "-"
  rollup>@rollup/rollup-darwin-arm64: "-"
  rollup>@rollup/rollup-darwin-x64: "-"
  rollup>@rollup/rollup-freebsd-arm64: "-"
  rollup>@rollup/rollup-freebsd-x64: "-"
  rollup>@rollup/rollup-linux-arm-gnueabihf: "-"
  rollup>@rollup/rollup-linux-arm-musleabihf: "-"
  rollup>@rollup/rollup-linux-arm64-gnu: "-"
  rollup>@rollup/rollup-linux-arm64-musl: "-"
  rollup>@rollup/rollup-linux-loong64-gnu: "-"
  rollup>@rollup/rollup-linux-loong64-musl: "-"
  rollup>@rollup/rollup-linux-ppc64-gnu: "-"
  rollup>@rollup/rollup-linux-ppc64-musl: "-"
  rollup>@rollup/rollup-linux-riscv64-gnu: "-"
  rollup>@rollup/rollup-linux-riscv64-musl: "-"
  rollup>@rollup/rollup-linux-s390x-gnu: "-"
  rollup>@rollup/rollup-linux-x64-musl: "-"
  rollup>@rollup/rollup-openbsd-x64: "-"
  rollup>@rollup/rollup-openharmony-arm64: "-"
  rollup>@rollup/rollup-win32-arm64-msvc: "-"
  rollup>@rollup/rollup-win32-ia32-msvc: "-"
  rollup>@rollup/rollup-win32-x64-gnu: "-"

  # Security: pin transitive dependencies to patched versions for known
  # GitHub advisories. Targeted version-range overrides are used where a
  # blanket override would force a major upgrade on an unrelated consumer.
  lodash: ^4.18.1
  path-to-regexp: ^8.4.2
  "picomatch@<2.3.2": ^2.3.2
  "picomatch@>=4.0.0 <4.0.4": ^4.0.4
  "brace-expansion@<1.1.13": ^1.1.13
  "brace-expansion@>=2.0.0 <2.0.3": ^2.0.3
  # brace-expansion picked up a v5 line (via the newer glob/minimatch chain);
  # <5.0.9 carries the same ReDoS advisory the 1.x/2.x pins above cover.
  "brace-expansion@>=5.0.0 <5.0.9": ^5.0.9
  uuid: ^14.0.0
  # postcss <=8.5.17: path traversal via sourceMappingURL auto-loading leads to
  # arbitrary .map file disclosure (GHSA-r28c-9q8g-f849). Reached only through
  # the vite/vitest/@tailwindcss-vite dev chain, but the audit gate is repo-wide.
  postcss: ^8.5.18
  # nanoid <3.3.18: custom generators can loop indefinitely when size is zero,
  # plus the earlier <3.3.16 advisory. Only the v3 line is in the graph (pulled
  # by postcss); the range form keeps a future v5 consumer from being downgraded.
  "nanoid@<3.3.18": ^3.3.18
  yaml: ^2.8.3
  http-proxy-agent: ^7.0.2
  vitest>vite: ^8.0.16
  vite-node>vite: ^8.0.16
  "@vitest/mocker>vite": ^8.0.16
  ws: ^8.21.0
  form-data: ^4.0.6
  # Moved from package.json "pnpm.overrides" during pnpm 11 upgrade
  # (pnpm 11 no longer reads the package.json field). esbuild and uuid
  # are intentionally omitted here — pnpm-workspace.yaml already pins
  # them to stricter versions above (esbuild ^0.28.1, uuid ^14.0.0).
  ip-address: ">=10.3.1"
  # (a former `fast-xml-builder` override was removed 2026-06: no package
  # by that name — or `fast-xml-parser` — exists anywhere in the graph,
  # so the pin protected nothing. Re-add a CORRECTLY-NAMED override if a
  # dependency ever pulls an XML parser with an advisory.)
  qs: ">=6.15.2"
  # axios <1.18.0 carries the Proxy-Authorization header-injection chain
  # (prototype pollution, plus the follow-up patch bypasses). Pin the
  # @sendgrid/client transitive to the patched version.
  "axios@<1.18.0": ^1.18.0
  # @babel/core <=7.29.0 is vulnerable to arbitrary file read via
  # sourceMappingURL comment (GHSA). Pin the eslint-plugin-react-hooks
  # transitive to the patched version.
  "@babel/core@<7.29.6": ^7.29.6
  # undici >=7.23.0 <7.28.0 is vulnerable to TLS certificate validation
  # bypass via dropped requestTls in the SOCKS5 ProxyAgent
  # (GHSA-vmh5-mc38-953g) and <7.29.0 the follow-up advisory. undici is a
  # direct (production) dependency of artifacts/resupply-api — kept in step at
  # ^7.29.0 in its manifest —
  # AND is pulled transitively via jsdom/vitest; this range override
  # forces every remaining transitive copy onto the patched version too.
  "undici@>=7.23.0 <7.29.0": ^7.29.0
